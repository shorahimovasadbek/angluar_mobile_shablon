@if (header()) {
  <ion-header>
    <ion-toolbar>
      @if (back(); as href) {
        <ion-buttons slot="start">
          <ion-back-button [defaultHref]="href" text="" />
        </ion-buttons>
      }
      <ion-title>{{ title() }}</ion-title>
    </ion-toolbar>
  </ion-header>
}

<ion-content>
  <ng-content />
</ion-content>

<ng-content select="ion-footer" />
