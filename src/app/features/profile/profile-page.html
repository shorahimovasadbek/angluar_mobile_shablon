<ui-page [title]="'tabs.profile' | translate">
  <div class="flex flex-col gap-3 p-4">
    @if (auth.user(); as user) {
      <section class="card">
        <p class="text-title text-ink">{{ user.name }}</p>
        <p class="text-body text-muted">{{ phone(user.phone) }}</p>
      </section>
    }

    <section class="card">
      <p class="text-label text-ink-2 mb-3">{{ 'profile.lang' | translate }}</p>
      <div class="flex gap-2">
        @for (l of langs; track l) {
          <ui-button size="sm" [variant]="lang.current() === l ? 'primary' : 'secondary'" (click)="lang.set(l)">
            {{ 'lang.' + l | translate }}
          </ui-button>
        }
      </div>
    </section>

    <ui-button variant="danger" size="md" block (click)="auth.logout()">
      {{ 'profile.logout' | translate }}
    </ui-button>
  </div>
</ui-page>
